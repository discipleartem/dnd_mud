  actor: Харизма +1; преимущество на Выступление и Обман при маскировке; подражание речи и звукам.
  alert: Бонус +5 к инициативе; вас не застать врасплох; скрытые не получают преимущества.
  athlete: Сила или Ловкость +1; вставание с 5 фт.; лазание без штрафа; прыжок с разбега 5 фт.
  charger: После Рывка — бонусная атака или толчок; +5 урона или толчок на 10 фт. после 10 фт. по прямой.
  crossbow_expert: Игнор перезарядки; стрельба вблизи без помехи; бонусная атака ручным арбалетом после Атаки.
  defensive_duelist: Реакцией добавить бонус мастерства к КД против рукопашной атаки с фехтовальным оружием.
  dual_wielder: +1 КД с двумя рукопашными; сражение с двумя оружиями без «лёгкого»; вынимать/убирать два оружия.
  dungeon_delver: Преимущество на поиск потайных дверей и ловушек; сопротивление урону ловушек; поиск на обычной скорости.
  durable: Телосложение +1; минимум восстановления по Кости Хитов — удвоенный модификатор Телосложения (мин. 2).
  elemental_adept: Игнор сопротивления выбранному урону; «1» на костях урона считаются «2»; можно брать повторно.
  grappler: Преимущество на атаки по захваченным; действием — сковать захваченное существо.
  great_weapon_master: Бонусная атака при крите/убийстве; −5/+10 на тяжёлое оружие.
  healer: 'Комплект целителя: стабилизация с 1 хитом; лечение 1к6+4 + макс. Кости Хитов цели.'
  heavily_armored: Сила +1; владение тяжёлыми доспехами.
  heavy_armor_master: Сила +1; в тяжёлом доспехе немагический физический урон снижается на 3.
  inspiring_leader: 10 минут — временные хиты (уровень + модификатор Харизмы) до 6 существ в 30 фт.
  keen_mind: Интеллект +1; ориентирование по сторонам света, времени; идеальная память за месяц.
  lightly_armored: Сила или Ловкость +1; владение лёгкими доспехами.
  linguist: Интеллект +1; три языка; шифрованные письма.
  lucky: '3 единицы удачи: дополнительный к20 на свои броски или при атаке по вам.'
  mage_slayer: Реакция по заклинателю в 5 фт.; помеха концентрации; преимущество на спасброски от заклинаний рядом.
  magic_initiate: Два заговора и одно заклинание 1 уровня от выбранного класса; 1/продолжительный отдых.
  martial_adept: Два приёма воина и одна кость превосходства (к6).
  medium_armor_master: Средние доспехи без помехи Скрытности; +3 к КД при Ловкости 16+.
  mobile: Скорость +10 фт.; Рывок без замедления на труднопроходимой местности; рукопашная атака не провоцирует ответ.
  moderately_armored: Сила или Ловкость +1; владение средними доспехами и щитами.
  mounted_combatant: 'Верхом: преимущество по меньшим существам; перенацеливание атак; спасброски скакуна.'
  observant: Интеллект или Мудрость +1; чтение по губам; +5 к пассивным Внимательности и Анализу.
  polearm_master: Бонусная атака противоположным концом; провоцированные атаки при входе в досягаемость.
  resilient: Выбранная характеристика +1; владение спасбросками по этой характеристике.
  ritual_caster: Ритуальная книга с двумя ритуалами 1 уровня; копирование ритуалов по правилам черты.
  savage_attacker: Раз в ход переброс всех костей урона рукопашной атаки.
  sentinel: Провоцированная атака обнуляет скорость; Отход не спасает; реакция по атакующему союзника.
  sharpshooter: Стрельба на макс. дистанции без помехи; игнор укрытия; −5/+10.
  shield_master: Толчок щитом; бонус щита к спасброскам; реакция без урона при успешном спасброске.
  skilled: Владение любой комбинацией из трёх навыков и инструментов.
  skulker: Скрытность при слабом укрытии; выстрел не выдаёт позицию; тусклый свет не мешает Внимательности.
  spell_sniper: Удвоенная дистанция атакующих заклинаний; игнор укрытия; заговор атаки.
  tavern_brawler: Сила или Телосложение +1; импровизированное оружие; безоружный удар к4; захват бонусным действием.
  tough: Максимум хитов +2× уровень при взятии; +2 за каждый последующий уровень.
  war_caster: Преимущество на концентрацию; соматические компоненты с оружием/щитом; заклинание вместо провоцированной атаки.
  weapon_master: Сила или Ловкость +1; владение четырьмя видами простого или воинского оружия.
  dragonborn: Сила +2, Харизма +1; оружие дыхания (2к6→5к6); сопротивление по родословной
  dwarf: Телосложение +2; тёмное зрение 60 фт.; устойчивость к яду; боевые топоры/молоты; инструменты ремесленника
  elf: Ловкость +2; тёмное зрение 60 фт.; Внимательность; наследие фей; транс 4 ч
  gnome: Интеллект +2; размер Маленький; тёмное зрение; хитрость гнома
  half_elf: Харизма +2; +1 к двум характеристикам; тёмное зрение; наследие фей; 2 навыка
  half_orc: Сила +2, Телосложение +1; тёмное зрение; неукротимость; свирепые атаки
  halfling: Ловкость +2; размер Маленький; скорость 25 фт.; везунчик; храбрость
  human: 'Стандарт: все характеристики +1; вариант: +1 к двум, навык, черта, язык'
  tiefling: Интеллект +1, Харизма +2; тёмное зрение; сопротивление огню; дьявольское наследие
